<!doctype html>
<html lang="et">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sõnamäng — kirjuta pilt</title>
        <script defer src="https://a.krister.ee/script.js" data-website-id="29f07a9d-d54a-4a9c-9a85-8c3e8cef8fcd"></script>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background-color: #282a36;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                overflow: hidden;
                font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue",
                    cursive, sans-serif;
                -webkit-user-select: none;
                user-select: none;
                touch-action: manipulation;
            }

            #emoji {
                font-size: 12rem;
                line-height: 1;
                margin-bottom: 3rem;
                cursor: pointer;
                transition: transform 0.15s ease;
            }

            #emoji:active {
                transform: scale(0.92);
            }

            #emoji.pop {
                animation: pop 0.9s ease-in-out;
            }

            #word {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.6rem;
                max-width: 92vw;
            }

            .box {
                width: 4.2rem;
                height: 5rem;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.05);
                border-bottom: 6px solid rgba(255, 255, 255, 0.18);
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 3.4rem;
                font-weight: bold;
                color: #fff;
            }

            .box.filled {
                background: rgba(255, 255, 255, 0.02);
                border-bottom-color: transparent;
            }

            .box.blast {
                animation: blast 0.9s ease-in-out;
            }

            .key {
                position: absolute;
                font-size: 5rem;
                font-weight: bold;
                pointer-events: none;
                animation: fall 1.8s ease-in forwards;
            }

            /* subtle hint that the next box is the one to fill */
            .box.active {
                border-bottom-color: rgba(255, 255, 255, 0.45);
            }

            #next {
                position: fixed;
                bottom: 1.2rem;
                right: 1.6rem;
                font-size: 2.4rem;
                color: rgba(255, 255, 255, 0.25);
                background: none;
                border: none;
                cursor: pointer;
                transition: color 0.2s ease, transform 0.2s ease;
            }

            #next:hover {
                color: rgba(255, 255, 255, 0.7);
                transform: scale(1.15);
            }

            #home {
                position: fixed;
                top: 1.2rem;
                left: 1.6rem;
                font-size: 2rem;
                text-decoration: none;
                opacity: 0.25;
                transition: opacity 0.2s ease;
            }

            #home:hover {
                opacity: 0.8;
            }

            #hint {
                position: fixed;
                bottom: 3.5rem;
                font-size: 1.6rem;
                color: rgba(255, 255, 255, 0.35);
                opacity: 0;
                transition: opacity 0.4s ease;
            }

            #hint.show {
                opacity: 1;
                animation: hintPulse 1.6s ease-in-out infinite;
            }

            #score {
                position: fixed;
                top: 1.2rem;
                right: 1.6rem;
                font-size: 2rem;
                font-weight: bold;
                color: rgba(255, 255, 255, 0.35);
                letter-spacing: 0.05em;
            }

            #score.bump {
                animation: bump 0.7s ease-in-out;
            }

            @keyframes blast {
                0% {
                    transform: scale(0.2);
                    opacity: 0;
                }
                25% {
                    transform: scale(1.4) rotate(4deg);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.15) rotate(-4deg);
                }
                75% {
                    transform: scale(1.3) rotate(3deg);
                }
                100% {
                    transform: scale(1) rotate(0deg);
                }
            }

            @keyframes fall {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(70vh) rotate(45deg);
                    opacity: 0;
                }
            }

            @keyframes hintPulse {
                0%,
                100% {
                    opacity: 0.35;
                }
                50% {
                    opacity: 1;
                }
            }

            @keyframes bump {
                0% {
                    transform: scale(1);
                    color: rgba(255, 255, 255, 0.35);
                }
                30% {
                    transform: scale(1.6);
                    color: #50fa7b;
                }
                100% {
                    transform: scale(1);
                    color: rgba(255, 255, 255, 0.35);
                }
            }

            @keyframes pop {
                0% {
                    transform: scale(1) rotate(0deg);
                }
                20% {
                    transform: scale(1.35) rotate(-8deg);
                }
                40% {
                    transform: scale(1.2) rotate(8deg);
                }
                60% {
                    transform: scale(1.3) rotate(-5deg);
                }
                80% {
                    transform: scale(1.15) rotate(5deg);
                }
                100% {
                    transform: scale(1) rotate(0deg);
                }
            }

            @media (max-width: 640px) {
                #emoji {
                    font-size: 7rem;
                    margin-bottom: 2rem;
                }
                .box {
                    width: 2.8rem;
                    height: 3.4rem;
                    font-size: 2.2rem;
                }
                .key {
                    font-size: 3.5rem;
                }
                #score {
                    font-size: 1.5rem;
                }
            }
        </style>
    </head>
    <body>
        <a id="home" href="index.html" title="Tagasi mängude juurde">🏠</a>
        <div id="score" title="Kirjutatud sõnad">⭐ 0</div>
        <div id="emoji"></div>
        <div id="word"></div>
        <div id="hint">vajuta klahvi 👉</div>
        <button id="next" title="Järgmine sõna">⏭</button>

        <script>
            // Selged, üheselt mõistetavad emojid ja nende eestikeelsed sõnad.
            var WORDS = [
                { e: "🐶", w: "KOER" },
                { e: "🐱", w: "KASS" },
                { e: "🐟", w: "KALA" },
                { e: "🐮", w: "LEHM" },
                { e: "🐷", w: "SIGA" },
                { e: "🐔", w: "KANA" },
                { e: "🐴", w: "HOBUNE" },
                { e: "🐰", w: "JÄNES" },
                { e: "🦊", w: "REBANE" },
                { e: "🐻", w: "KARU" },
                { e: "🦁", w: "LÕVI" },
                { e: "🐘", w: "ELEVANT" },
                { e: "🐸", w: "KONN" },
                { e: "🐝", w: "MESILANE" },
                { e: "🦋", w: "LIBLIKAS" },
                { e: "🐢", w: "KILPKONN" },
                { e: "🐭", w: "HIIR" },
                { e: "🐺", w: "HUNT" },
                { e: "🐧", w: "PINGVIIN" },
                { e: "🐍", w: "MADU" },
                { e: "🍎", w: "ÕUN" },
                { e: "🍌", w: "BANAAN" },
                { e: "🍓", w: "MAASIKAS" },
                { e: "🍐", w: "PIRN" },
                { e: "🥕", w: "PORGAND" },
                { e: "🍄", w: "SEEN" },
                { e: "🥚", w: "MUNA" },
                { e: "🍞", w: "LEIB" },
                { e: "🧀", w: "JUUST" },
                { e: "🥛", w: "PIIM" },
                { e: "🌸", w: "LILL" },
                { e: "🌳", w: "PUU" },
                { e: "☀️", w: "PÄIKE" },
                { e: "🌙", w: "KUU" },
                { e: "⭐", w: "TÄHT" },
                { e: "☁️", w: "PILV" },
                { e: "❄️", w: "LUMI" },
                { e: "🔥", w: "TULI" },
                { e: "💧", w: "VESI" },
                { e: "🌈", w: "VIKERKAAR" },
                { e: "🚗", w: "AUTO" },
                { e: "🚂", w: "RONG" },
                { e: "✈️", w: "LENNUK" },
                { e: "⛵", w: "PAAT" },
                { e: "🚲", w: "JALGRATAS" },
                { e: "🏠", w: "MAJA" },
                { e: "⚽", w: "PALL" },
                { e: "📖", w: "RAAMAT" },
                { e: "🔑", w: "VÕTI" },
                { e: "⏰", w: "KELL" },
                { e: "👑", w: "KROON" },
                { e: "🧦", w: "SOKK" },
                { e: "🎈", w: "ÕHUPALL" },
                { e: "🎁", w: "KINGITUS" },
                { e: "👁️", w: "SILM" },
                { e: "👃", w: "NINA" },
                { e: "✋", w: "KÄSI" },
                { e: "🦷", w: "HAMMAS" },
            ];

            var emojiEl = document.getElementById("emoji");
            var wordEl = document.getElementById("word");
            var nextEl = document.getElementById("next");
            var scoreEl = document.getElementById("score");
            var hintEl = document.getElementById("hint");

            var current = null; // { e, w }
            var typed = 0; // kui palju tähti õigesti kirjutatud
            var locked = false; // sõna valmis, ootab järgmist
            var awaiting = false; // tähistamine läbi, ootame klahvivajutust
            var lower = false; // suur- või väiketähed
            var shown = {}; // selles sessioonis näidatud (ka vahelejäetud)

            // Mitu sõna on juba edukalt kirjutatud (püsib sessiooni jooksul).
            // Pärast 3 sõna lülitume väiketähtedele, et laps õpiks ka neid.
            var STORE = "sonamang.completed";
            function getCompleted() {
                try {
                    return parseInt(sessionStorage.getItem(STORE), 10) || 0;
                } catch (err) {
                    return 0;
                }
            }
            function setCompleted(n) {
                try {
                    sessionStorage.setItem(STORE, String(n));
                } catch (err) {}
            }

            // Punktid: kokku kirjutatud sõnad, säilivad ka pärast sulgemist.
            var SCORE_STORE = "sonamang.score";
            function getScore() {
                try {
                    return parseInt(localStorage.getItem(SCORE_STORE), 10) || 0;
                } catch (err) {
                    return 0;
                }
            }
            function setScore(n) {
                try {
                    localStorage.setItem(SCORE_STORE, String(n));
                } catch (err) {}
            }
            // Juba ära vastatud sõnad — need jäävad meelde ka pärast brauseri
            // sulgemist, nii et sama sõna ei tule enne uut ringi tagasi.
            var SEEN_STORE = "sonamang.seen";
            var seen = loadSeen();
            function loadSeen() {
                var map = {};
                try {
                    var raw = localStorage.getItem(SEEN_STORE);
                    var list = raw ? JSON.parse(raw) : [];
                    for (var i = 0; i < list.length; i++) map[list[i]] = true;
                } catch (err) {}
                return map;
            }
            function saveSeen() {
                try {
                    localStorage.setItem(
                        SEEN_STORE,
                        JSON.stringify(Object.keys(seen)),
                    );
                } catch (err) {}
            }

            function renderScore(bump) {
                scoreEl.textContent = "⭐ " + getScore();
                if (bump) {
                    scoreEl.classList.remove("bump");
                    void scoreEl.offsetWidth;
                    scoreEl.classList.add("bump");
                }
            }

            // Täpitähtede lihtsustus: kehv klaviatuur → o käib ö/õ, a käib ä jne.
            var BASE = { Ä: "A", Ö: "O", Õ: "O", Ü: "U", Š: "S", Ž: "Z" };
            function baseUpper(ch) {
                var u = ch.toUpperCase();
                return BASE[u] || u;
            }
            // Kuidas tähte ekraanil näidata (õige täpitäht, õiges suuruses).
            function show(ch) {
                return lower ? ch.toLowerCase() : ch.toUpperCase();
            }

            function shuffle(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = arr[i];
                    arr[i] = arr[j];
                    arr[j] = t;
                }
                return arr;
            }

            // Sõnad lühemast pikemani. Segame enne sortimist, nii et võrdse
            // pikkusega sõnad on igal külastusel juhuslikus järjekorras.
            var SORTED = shuffle(WORDS.slice()).sort(function (a, b) {
                return a.w.length - b.w.length;
            });
            var WINDOW_BASE = 6; // mitu lühimat sõna on algusest peale valikus

            // Vali juhuslik sõna "lühemast valikust". Valik kasvab edu käigus:
            // alguses ainult lühikesed sõnad, iga õnnestunud sõnaga lisandub
            // pikemaid. Uuesti mängides algab jälle lühikestest.
            // Ükski sõna ei kordu enne, kui kõik on läbi käidud — ka mitte
            // järgmisel päeval. Valime lühemate sõnade aknast; kui seal pole
            // enam ühtki vastamata sõna, võtame lihtsalt lühimad vastamata
            // sõnad, et raskus ei hüppaks korraga pikkade sõnade peale.
            function pickWord() {
                var k = Math.min(SORTED.length, WINDOW_BASE + getCompleted());
                var pool = available(SORTED.slice(0, k));
                if (!pool.length) pool = available(SORTED).slice(0, WINDOW_BASE);
                if (!pool.length) {
                    // Kõik ülejäänud on selles sessioonis juba näidatud, aga
                    // vastamata (vahele jäetud) — lubame need uuesti.
                    shown = {};
                    pool = available(SORTED).slice(0, WINDOW_BASE);
                }
                if (!pool.length) {
                    // Terve nimekiri läbi — alustame uut ringi.
                    seen = {};
                    saveSeen();
                    pool = SORTED.slice(0, k);
                }
                var pick = pool[Math.floor(Math.random() * pool.length)];
                shown[pick.w] = true;
                return pick;
            }

            // Sõnad, mis pole veel vastatud ega selles sessioonis näidatud.
            // Järjekord jääb samaks (lühemad ees).
            function available(list) {
                var out = [];
                for (var i = 0; i < list.length; i++) {
                    var w = list[i].w;
                    if (!seen[w] && !shown[w]) out.push(list[i]);
                }
                return out;
            }

            function gen_rand_color() {
                var a = 128;
                var b = 255 - a;
                return (
                    "#" +
                    (Math.floor(Math.random() * a) + b).toString(16) +
                    (Math.floor(Math.random() * a) + b).toString(16) +
                    (Math.floor(Math.random() * a) + b).toString(16)
                );
            }

            function loadNext() {
                current = pickWord();
                typed = 0;
                locked = false;
                lower = getCompleted() >= 3; // 4. sõnast alates väiketähed

                emojiEl.textContent = current.e;

                // ehita kastid — üks iga tähe kohta, ilma vihjeta
                wordEl.innerHTML = "";
                for (var i = 0; i < current.w.length; i++) {
                    var box = document.createElement("div");
                    box.className = "box";
                    wordEl.appendChild(box);
                }
                markActive();
            }

            function markActive() {
                var boxes = wordEl.getElementsByClassName("box");
                for (var i = 0; i < boxes.length; i++) {
                    boxes[i].classList.remove("active");
                }
                if (typed < boxes.length) boxes[typed].classList.add("active");
            }

            function fillBox() {
                var boxes = wordEl.getElementsByClassName("box");
                var box = boxes[typed];
                // Näita alati õiget tähte (õige täpitäht), sõltumata sellest
                // mida vajutati — nii õpib laps õige kirjapildi.
                box.textContent = show(current.w[typed]);
                box.style.color = gen_rand_color();
                box.classList.add("filled");
                box.classList.remove("active");
                // sunni animatsioon uuesti käivituma
                box.classList.remove("blast");
                void box.offsetWidth;
                box.classList.add("blast");
                typed++;
                markActive();

                if (typed === current.w.length) {
                    celebrate();
                }
            }

            // Sõna valmis. Edasi liigume alles siis, kui vajutatakse klahvi —
            // aga anname rõõmustamiseks hetke aega, et viimane täht ja emoji
            // saaksid oma animatsiooni ära teha.
            function celebrate() {
                locked = true;
                awaiting = false;
                seen[current.w] = true;
                saveSeen();
                setCompleted(getCompleted() + 1);
                setScore(getScore() + 1);
                renderScore(true);
                emojiEl.classList.remove("pop");
                void emojiEl.offsetWidth;
                emojiEl.classList.add("pop");
                setTimeout(function () {
                    awaiting = true;
                    hintEl.classList.add("show");
                }, 900);
            }

            // Järgmine sõna: kohe (sõna pooleli) või pärast tähistamist.
            function advance() {
                if (locked && !awaiting) return;
                hintEl.classList.remove("show");
                loadNext();
            }

            // Täht kukub minema. Kui anda kast kaasa (õige täht, aga liiga
            // vara), tekib täht just selle kasti kohale ja kukub sealt.
            function floatAway(letter, box) {
                var el = document.createElement("div");
                el.className = "key";
                el.textContent = letter;
                el.style.color = gen_rand_color();
                if (box) {
                    el.style.visibility = "hidden";
                    document.body.appendChild(el);
                    var r = box.getBoundingClientRect();
                    el.style.left =
                        r.left + (r.width - el.offsetWidth) / 2 + "px";
                    el.style.top =
                        r.top + (r.height - el.offsetHeight) / 2 + "px";
                    el.style.visibility = "";
                } else {
                    el.style.left = 5 + Math.random() * 85 + "vw";
                    el.style.top = 8 + Math.random() * 25 + "vh";
                    document.body.appendChild(el);
                }
                setTimeout(function () {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 1800);
            }

            // Kus see täht sõnas hiljem esineb? -1 kui üldse ei esine.
            function laterIndex(ch) {
                for (var i = typed + 1; i < current.w.length; i++) {
                    if (baseUpper(ch) === baseUpper(current.w[i])) return i;
                }
                return -1;
            }

            // Kas tegemist on tähega (ka eesti täpitähed)?
            function isLetter(ch) {
                return /^[A-Za-zÄÖÜÕŠŽäöüõšž]$/.test(ch);
            }

            document.addEventListener("keydown", function (event) {
                if (event.ctrlKey || event.metaKey || event.altKey) return;

                // Sõna valmis → ükskõik milline klahv viib edasi.
                if (locked) {
                    advance();
                    return;
                }

                var ch = event.key;
                if (ch.length !== 1 || !isLetter(ch)) return;

                // täpitähed lihtsustatud: võrdle põhitähti (o == ö == õ)
                if (baseUpper(ch) === baseUpper(current.w[typed])) {
                    fillBox();
                    return;
                }

                // Õige täht, aga liiga vara: näita seda seal, kuhu ta hiljem
                // kuulub — ja lase siiski minema kukkuda.
                var later = laterIndex(ch);
                if (later !== -1) {
                    var boxes = wordEl.getElementsByClassName("box");
                    floatAway(show(current.w[later]), boxes[later]);
                } else {
                    floatAway(show(ch));
                }
            });

            // Klõps emojil või ⏭ nupul → järgmine sõna (ka puuteekraanil)
            nextEl.addEventListener("click", advance);
            emojiEl.addEventListener("click", advance);

            renderScore(false);
            loadNext();
</script>
    </body>
</html>
