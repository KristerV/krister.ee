<!doctype html>
<html lang="et">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sõnamäng — kirjuta pilt</title>
        <script defer src="https://a.krister.ee/script.js" data-website-id="29f07a9d-d54a-4a9c-9a85-8c3e8cef8fcd"></script>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background-color: #282a36;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                overflow: hidden;
                font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue",
                    cursive, sans-serif;
                -webkit-user-select: none;
                user-select: none;
                touch-action: manipulation;
            }

            #emoji {
                font-size: 12rem;
                line-height: 1;
                margin-bottom: 3rem;
                cursor: pointer;
                transition: transform 0.15s ease;
            }

            #emoji:active {
                transform: scale(0.92);
            }

            #emoji.pop {
                animation: pop 0.9s ease-in-out;
            }

            #word {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.6rem;
                max-width: 92vw;
            }

            .box {
                width: 4.2rem;
                height: 5rem;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.05);
                border-bottom: 6px solid rgba(255, 255, 255, 0.18);
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 3.4rem;
                font-weight: bold;
                color: #fff;
            }

            .box.filled {
                background: rgba(255, 255, 255, 0.02);
                border-bottom-color: transparent;
            }

            .box.blast {
                animation: blast 0.9s ease-in-out;
            }

            .key {
                position: absolute;
                font-size: 5rem;
                font-weight: bold;
                pointer-events: none;
                animation: fall 1.8s ease-in forwards;
            }

            /* subtle hint that the next box is the one to fill */
            .box.active {
                border-bottom-color: rgba(255, 255, 255, 0.45);
            }

            #next {
                position: fixed;
                bottom: 1.2rem;
                right: 1.6rem;
                font-size: 2.4rem;
                color: rgba(255, 255, 255, 0.25);
                background: none;
                border: none;
                cursor: pointer;
                transition: color 0.2s ease, transform 0.2s ease;
            }

            #next:hover {
                color: rgba(255, 255, 255, 0.7);
                transform: scale(1.15);
            }

            #home {
                position: fixed;
                top: 1.2rem;
                left: 1.6rem;
                font-size: 2rem;
                text-decoration: none;
                opacity: 0.25;
                transition: opacity 0.2s ease;
            }

            #home:hover {
                opacity: 0.8;
            }

            @keyframes blast {
                0% {
                    transform: scale(0.2);
                    opacity: 0;
                }
                25% {
                    transform: scale(1.4) rotate(4deg);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.15) rotate(-4deg);
                }
                75% {
                    transform: scale(1.3) rotate(3deg);
                }
                100% {
                    transform: scale(1) rotate(0deg);
                }
            }

            @keyframes fall {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(70vh) rotate(45deg);
                    opacity: 0;
                }
            }

            @keyframes pop {
                0% {
                    transform: scale(1) rotate(0deg);
                }
                20% {
                    transform: scale(1.35) rotate(-8deg);
                }
                40% {
                    transform: scale(1.2) rotate(8deg);
                }
                60% {
                    transform: scale(1.3) rotate(-5deg);
                }
                80% {
                    transform: scale(1.15) rotate(5deg);
                }
                100% {
                    transform: scale(1) rotate(0deg);
                }
            }

            @media (max-width: 640px) {
                #emoji {
                    font-size: 7rem;
                    margin-bottom: 2rem;
                }
                .box {
                    width: 2.8rem;
                    height: 3.4rem;
                    font-size: 2.2rem;
                }
                .key {
                    font-size: 3.5rem;
                }
            }
        </style>
    </head>
    <body>
        <a id="home" href="index.html" title="Tagasi mängude juurde">🏠</a>
        <div id="emoji"></div>
        <div id="word"></div>
        <button id="next" title="Järgmine sõna">⏭</button>

        <script>
            // Selged, üheselt mõistetavad emojid ja nende eestikeelsed sõnad.
            var WORDS = [
                { e: "🐶", w: "KOER" },
                { e: "🐱", w: "KASS" },
                { e: "🐟", w: "KALA" },
                { e: "🐮", w: "LEHM" },
                { e: "🐷", w: "SIGA" },
                { e: "🐔", w: "KANA" },
                { e: "🐴", w: "HOBUNE" },
                { e: "🐰", w: "JÄNES" },
                { e: "🦊", w: "REBANE" },
                { e: "🐻", w: "KARU" },
                { e: "🦁", w: "LÕVI" },
                { e: "🐘", w: "ELEVANT" },
                { e: "🐸", w: "KONN" },
                { e: "🐝", w: "MESILANE" },
                { e: "🦋", w: "LIBLIKAS" },
                { e: "🐢", w: "KILPKONN" },
                { e: "🐭", w: "HIIR" },
                { e: "🐺", w: "HUNT" },
                { e: "🐧", w: "PINGVIIN" },
                { e: "🐍", w: "MADU" },
                { e: "🍎", w: "ÕUN" },
                { e: "🍌", w: "BANAAN" },
                { e: "🍓", w: "MAASIKAS" },
                { e: "🍐", w: "PIRN" },
                { e: "🥕", w: "PORGAND" },
                { e: "🍄", w: "SEEN" },
                { e: "🥚", w: "MUNA" },
                { e: "🍞", w: "LEIB" },
                { e: "🧀", w: "JUUST" },
                { e: "🥛", w: "PIIM" },
                { e: "🌸", w: "LILL" },
                { e: "🌳", w: "PUU" },
                { e: "☀️", w: "PÄIKE" },
                { e: "🌙", w: "KUU" },
                { e: "⭐", w: "TÄHT" },
                { e: "☁️", w: "PILV" },
                { e: "❄️", w: "LUMI" },
                { e: "🔥", w: "TULI" },
                { e: "💧", w: "VESI" },
                { e: "🌈", w: "VIKERKAAR" },
                { e: "🚗", w: "AUTO" },
                { e: "🚂", w: "RONG" },
                { e: "✈️", w: "LENNUK" },
                { e: "⛵", w: "PAAT" },
                { e: "🚲", w: "JALGRATAS" },
                { e: "🏠", w: "MAJA" },
                { e: "⚽", w: "PALL" },
                { e: "📖", w: "RAAMAT" },
                { e: "🔑", w: "VÕTI" },
                { e: "⏰", w: "KELL" },
                { e: "👑", w: "KROON" },
                { e: "🧦", w: "SOKK" },
                { e: "🎈", w: "ÕHUPALL" },
                { e: "🎁", w: "KINGITUS" },
                { e: "👁️", w: "SILM" },
                { e: "👃", w: "NINA" },
                { e: "✋", w: "KÄSI" },
                { e: "🦷", w: "HAMMAS" },
            ];

            var emojiEl = document.getElementById("emoji");
            var wordEl = document.getElementById("word");
            var nextEl = document.getElementById("next");

            var order = [];
            var orderPos = 0;
            var current = null; // { e, w }
            var typed = 0; // kui palju tähti õigesti kirjutatud
            var locked = false; // sõna valmis, ootab järgmist
            var lower = false; // suur- või väiketähed

            // Mitu sõna on juba edukalt kirjutatud (püsib sessiooni jooksul).
            // Pärast 3 sõna lülitume väiketähtedele, et laps õpiks ka neid.
            var STORE = "sonamang.completed";
            function getCompleted() {
                try {
                    return parseInt(sessionStorage.getItem(STORE), 10) || 0;
                } catch (err) {
                    return 0;
                }
            }
            function setCompleted(n) {
                try {
                    sessionStorage.setItem(STORE, String(n));
                } catch (err) {}
            }

            // Täpitähtede lihtsustus: kehv klaviatuur → o käib ö/õ, a käib ä jne.
            var BASE = { Ä: "A", Ö: "O", Õ: "O", Ü: "U", Š: "S", Ž: "Z" };
            function baseUpper(ch) {
                var u = ch.toUpperCase();
                return BASE[u] || u;
            }
            // Kuidas tähte ekraanil näidata (õige täpitäht, õiges suuruses).
            function show(ch) {
                return lower ? ch.toLowerCase() : ch.toUpperCase();
            }

            function shuffle(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = arr[i];
                    arr[i] = arr[j];
                    arr[j] = t;
                }
                return arr;
            }

            function buildOrder() {
                order = shuffle(WORDS.slice());
                orderPos = 0;
            }

            function gen_rand_color() {
                var a = 128;
                var b = 255 - a;
                return (
                    "#" +
                    (Math.floor(Math.random() * a) + b).toString(16) +
                    (Math.floor(Math.random() * a) + b).toString(16) +
                    (Math.floor(Math.random() * a) + b).toString(16)
                );
            }

            function loadNext() {
                if (orderPos >= order.length) buildOrder();
                current = order[orderPos++];
                typed = 0;
                locked = false;
                lower = getCompleted() >= 3; // 4. sõnast alates väiketähed

                emojiEl.textContent = current.e;

                // ehita kastid — üks iga tähe kohta, ilma vihjeta
                wordEl.innerHTML = "";
                for (var i = 0; i < current.w.length; i++) {
                    var box = document.createElement("div");
                    box.className = "box";
                    wordEl.appendChild(box);
                }
                markActive();
            }

            function markActive() {
                var boxes = wordEl.getElementsByClassName("box");
                for (var i = 0; i < boxes.length; i++) {
                    boxes[i].classList.remove("active");
                }
                if (typed < boxes.length) boxes[typed].classList.add("active");
            }

            function fillBox() {
                var boxes = wordEl.getElementsByClassName("box");
                var box = boxes[typed];
                // Näita alati õiget tähte (õige täpitäht), sõltumata sellest
                // mida vajutati — nii õpib laps õige kirjapildi.
                box.textContent = show(current.w[typed]);
                box.style.color = gen_rand_color();
                box.classList.add("filled");
                box.classList.remove("active");
                // sunni animatsioon uuesti käivituma
                box.classList.remove("blast");
                void box.offsetWidth;
                box.classList.add("blast");
                typed++;
                markActive();

                if (typed === current.w.length) {
                    celebrate();
                }
            }

            function celebrate() {
                locked = true;
                setCompleted(getCompleted() + 1);
                emojiEl.classList.remove("pop");
                void emojiEl.offsetWidth;
                emojiEl.classList.add("pop");
                setTimeout(loadNext, 1500);
            }

            function floatAway(letter) {
                var el = document.createElement("div");
                el.className = "key";
                el.textContent = letter;
                el.style.left = 5 + Math.random() * 85 + "vw";
                el.style.top = 8 + Math.random() * 25 + "vh";
                el.style.color = gen_rand_color();
                document.body.appendChild(el);
                setTimeout(function () {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 1800);
            }

            // Kas tegemist on tähega (ka eesti täpitähed)?
            function isLetter(ch) {
                return /^[A-Za-zÄÖÜÕŠŽäöüõšž]$/.test(ch);
            }

            document.addEventListener("keydown", function (event) {
                if (event.ctrlKey || event.metaKey || event.altKey) return;
                var ch = event.key;
                if (ch.length !== 1 || !isLetter(ch)) return;

                if (locked) {
                    floatAway(show(ch));
                    return;
                }

                // täpitähed lihtsustatud: võrdle põhitähti (o == ö == õ)
                if (baseUpper(ch) === baseUpper(current.w[typed])) {
                    fillBox();
                } else {
                    floatAway(show(ch));
                }
            });

            // Klõps emojil või ⏭ nupul → järgmine sõna
            nextEl.addEventListener("click", function () {
                if (!locked) loadNext();
            });
            emojiEl.addEventListener("click", function () {
                if (!locked) loadNext();
            });

            buildOrder();
            loadNext();
        </script>
    </body>
</html>
